name: Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0' # Chạy hàng tuần vào Chủ Nhật

jobs:
  # 1. Kiểm tra bảo mật Dependencies (SCA)
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      # Backend Audit
      - name: Audit Backend Dependencies
        working-directory: ./server
        # Dùng `npm audit --audit-level=high` để báo lỗi nếu có lỗ hổng nghiêm trọng
        # `|| true` giúp job không fail ngay lập tức, chỉ warning (để không chặn workflow nếu chưa fix được)
        # Bỏ `|| true` nếu muốn bắt buộc phải fix lỗi bảo mật mới được merge.
        run: npm audit --audit-level=high || true 

      # Frontend Audit
      - name: Audit Frontend Dependencies
        working-directory: ./client
        run: npm audit --audit-level=high || true

  # 2. Quét Code tĩnh (SAST) - Tìm lỗi bảo mật trong code (SQLi, XSS...)
  # CodeQL đã được cấu hình trong .github/workflows/codeql.yml riêng biệt, có thể bỏ qua hoặc giữ lại nếu muốn gom nhóm.
  # Để tránh trùng lặp tài nguyên, ta sẽ bỏ job này ở đây và để codeql.yml lo.

  # 3. Quét Secret (Tìm API Key, Password bị lộ)
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        # Fix lỗi "BASE and HEAD commits are the same":
        # Khi push lên main, base và head trỏ cùng commit.
        # Thêm điều kiện: Chỉ chạy scan diff khi là PR.
        # Nếu là push main, scan toàn bộ (hoặc bỏ qua base/head).
        if: github.event_name == 'pull_request'

      - name: TruffleHog OSS (Full Scan on Push)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified --no-verification
        if: github.event_name == 'push'
