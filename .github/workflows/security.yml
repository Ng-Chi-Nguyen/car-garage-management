name: Security Audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 0" # Chạy hàng tuần vào Chủ Nhật

permissions:
  contents: read

jobs:
  # 1. Kiểm tra bảo mật Dependencies (SCA)
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Backend Audit
      - name: Audit Backend Dependencies
        working-directory: ./server
        # Dùng `npm audit --audit-level=high` để báo lỗi nếu có lỗ hổng nghiêm trọng
        # `|| true` giúp job không fail ngay lập tức, chỉ warning (để không chặn workflow nếu chưa fix được)
        # Bỏ `|| true` nếu muốn bắt buộc phải fix lỗi bảo mật mới được merge.
        run: npm audit --audit-level=high || true

      # Frontend Audit
      - name: Audit Frontend Dependencies
        working-directory: ./client
        run: npm audit --audit-level=high || true

  # 2. Quét Code tĩnh (SAST) - Tìm lỗi bảo mật trong code (SQLi, XSS...)
  # CodeQL đã được cấu hình trong .github/workflows/codeql.yml riêng biệt, có thể bỏ qua hoặc giữ lại nếu muốn gom nhóm.
  # Để tránh trùng lặp tài nguyên, ta sẽ bỏ job này ở đây và để codeql.yml lo.

  # 3. Quét Secret (Tìm API Key, Password bị lộ)
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog OSS (Pull Request)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.95.5
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --debug --only-verified

      - name: TruffleHog OSS (Push/Schedule)
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@v3.95.5
        with:
          path: ./
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --debug --results=verified,unknown

  # 4. Compatibility CodeQL scan to preserve existing main-branch config key
  # Keeps Code Scanning PR delta check from reporting
  # "1 configuration not found" for `.github/workflows/security.yml:codeql-analysis`.
  codeql-analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL (compat)
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis (compat category)
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"
